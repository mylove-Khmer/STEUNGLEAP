<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - STEUNGLEAP</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #1f2937; }
    </style>
</head>
<body class="text-white">

    <!-- Admin Header -->
    <header class="bg-gray-900 shadow py-4 px-6 flex justify-between items-center border-b border-gray-700">
        <div class="flex items-center space-x-3">
            <img src="logo.png" alt="Logo" class="h-8 w-auto object-contain">
            <h1 class="text-xl font-bold text-yellow-400">ផ្ទាំងគ្រប់គ្រងអែតមីន (Admin Panel)</h1>
        </div>
        <a href="index.html" class="bg-gray-700 text-sm px-4 py-2 rounded hover:bg-gray-600">មើលវេបសាយ (Go to Site)</a>
    </header>

    <!-- Admin Form Content -->
    <main class="container mx-auto px-4 py-8 max-w-xl">
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg border border-gray-700">
            <h2 class="text-lg font-bold mb-4 text-yellow-300">បញ្ចូលព័ត៌មានថ្មី</h2>
            <form id="admin-news-form" class="space-y-4">
                
                <div>
                    <label class="block text-xs text-gray-300 mb-1">ឈ្មោះព័ត៌មាន (ចំណងជើង)</label>
                    <input type="text" id="a-title" required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-400" placeholder="វាយបញ្ចូលឈ្មោះព័ត៌មាន...">
                </div>

                <div>
                    <label class="block text-xs text-gray-300 mb-1">ជ្រើសរើសរូបភាពព័ត៌មាន (អាចដាក់បាន)</label>
                    <input type="file" id="a-image" accept="image/*" required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-1.5 text-xs text-white focus:outline-none focus:border-yellow-400 file:mr-4 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-yellow-500 file:text-gray-900 hover:file:bg-yellow-400">
                </div>

                <div>
                    <label class="block text-xs text-gray-300 mb-1">អក្សរព័ត៌មាន (ខ្លឹមសារ)</label>
                    <textarea id="a-desc" rows="5" required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-400" placeholder="សរសេរអក្សរព័ត៌មាន ឬខ្លឹមសារនៅទីនេះ..."></textarea>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-yellow-500 text-gray-900 font-bold py-2 rounded text-sm hover:bg-yellow-400 transition">ចុះផ្សាយព័ត៌មានឥឡូវនេះ</button>
            </form>
        </div>
    </main>

    <!-- Firebase SDK & Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCj8Fz-LyCydPLVz2F2z80NyyA-1JJnoIA",
            authDomain: "steungleap-123af.firebaseapp.com",
            projectId: "steungleap-123af",
            storageBucket: "steungleap-123af.firebasestorage.app",
            messagingSenderId: "97711978773",
            appId: "1:97711978773:web:577b7b53ff44836f8ed1ic"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ฟังก์ชันបង្រួមទំហំរូបភាព (Resize Image) ដើម្បីកុំឱ្យធំពេក
        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = error => reject(error);
                };
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('admin-news-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const title = document.getElementById('a-title').value;
            const desc = document.getElementById('a-desc').value;
            const date = '៨ វិច្ឆិកា ២០២៦';
            const imageFile = document.getElementById('a-image').files[0];
            const submitBtn = document.getElementById('submit-btn');

            if (!imageFile) return;

            submitBtn.disabled = true;
            submitBtn.innerText = "កំពុងរៀបចំរូបភាព...";

            try {
                // បង្រួមរូបភាពមុននឹងបញ្ជូន
                const compressedImage = await compressImage(imageFile);
                
                submitBtn.innerText = "កំពុងចុះផ្សាយ...";

                await addDoc(collection(db, "news"), {
                    title: title,
                    desc: desc,
                    image: compressedImage,
                    date: date,
                    timestamp: serverTimestamp()
                });

                alert("ព័ត៌មានត្រូវបានចុះផ្សាយដោយជោគជ័យ!");
                document.getElementById('admin-news-form').reset();
            } catch (error) {
                alert("មានបញ្ហា៖ " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "ចុះផ្សាយព័ត៌មានឥឡូវនេះ";
            }
        });
    </script>
</body>
</html>
