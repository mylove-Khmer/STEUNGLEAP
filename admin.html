<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - STEUNGLEAP</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #1f2937; }
    </style>
</head>
<body class="text-white">

    <!-- Admin Header -->
    <header class="bg-gray-900 shadow py-4 px-6 flex justify-between items-center border-b border-gray-700">
        <div class="flex items-center space-x-3">
            <!-- ត្រង់កន្លែង logo.png សូមដាក់ឈ្មោះហ្វាល ឬ URL ឡូហ្គោរបស់អ្នក -->
            <img src="logo.png" alt="Logo" class="h-8 w-auto object-contain">
            <h1 class="text-xl font-bold text-yellow-400">ផ្ទាំងគ្រប់គ្រងអែតមីន (Admin Panel)</h1>
        </div>
        <a href="index.html" class="bg-gray-700 text-sm px-4 py-2 rounded hover:bg-gray-600">មើលវេបសាយ (Go to Site)</a>
    </header>

    <!-- Admin Form Content -->
    <main class="container mx-auto px-4 py-8 max-w-xl">
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg border border-gray-700">
            <h2 class="text-lg font-bold mb-4 text-yellow-300">បញ្ចូលអត្ថបទព័ត៌មានថ្មី</h2>
            <form id="admin-news-form" onsubmit="publishNews(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-300 mb-1">ចំណងជើងព័ត៌មាន</label>
                    <input type="text" id="a-title" required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-400" placeholder="ចំណងជើង...">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-300 mb-1">ប្រភេទព័ត៌មាន</label>
                        <select id="a-category" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-400">
                            <option value="នយោបាយ">នយោបាយ</option>
                            <option value="សង្គម">សង្គម</option>
                            <option value="សេដ្ឋកិច្ច">សេដ្ឋកិច្ច</option>
                            <option value="បច្ចេកវិទ្យា">បច្ចេកវិទ្យា</option>
                            <option value="អន្តរជាតិ">អន្តរជាតិ</option>
                            <option value="កីឡា">កីឡា</option>
                            <option value="កម្សាន្ត">កម្សាន្ត</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-300 mb-1">តំណភ្ជាប់រូបភាព (Image URL)</label>
                        <input type="url" id="a-image" required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-400" placeholder="https://...">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-300 mb-1">សេចក្តីលម្អិតខ្លីៗ</label>
                    <textarea id="a-desc" rows="4" required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-400" placeholder="ខ្លឹមសារសង្ខេប..."></textarea>
                </div>
                <button type="submit" class="w-full bg-yellow-500 text-gray-900 font-bold py-2 rounded text-sm hover:bg-yellow-400 transition">ចុះផ្សាយព័ត៌មាន</button>
            </form>
        </div>
    </main>

    <script>
        function publishNews(event) {
            event.preventDefault();
            
            const title = document.getElementById('a-title').value;
            const category = document.getElementById('a-category').value;
            const image = document.getElementById('a-image').value;
            const desc = document.getElementById('a-desc').value;
            const date = '៨ វិច្ឆិកា ២០២៦';

            const newItem = { title, category, image, desc, date };

            let newsList = JSON.parse(localStorage.getItem('steungleap_news')) || [];
            newsList.unshift(newItem);
            localStorage.setItem('steungleap_news', JSON.stringify(newsList));

            alert("ព័ត៌មានត្រូវបានចុះផ្សាយដោយជោគជ័យ!");
            document.getElementById('admin-news-form').reset();
        }
    </script>
</body>
</html>
