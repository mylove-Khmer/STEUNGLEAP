<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEUNGLEAP - វេបសាយព័ត៌មានទាន់ហេតុការណ៍</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="text-gray-800">

    <!-- Top Bar -->
    <div class="bg-gray-900 text-gray-300 text-sm py-2">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div class="font-light">ថ្ងៃអាទិត្យ ទី៨ ខែវិច្ឆិកា ឆ្នាំ២០២៦</div>
            <div class="flex space-x-4 items-center">
                <a href="tel:0883473358" class="text-yellow-400 font-bold hover:underline">📞 0883473358</a>
                <a href="#" class="hover:text-white">អំពីយើង</a>
                <a href="#" class="hover:text-white">ទំនាក់ទំនង</a>
            </div>
        </div>
    </div>

    <!-- Header & Logo -->
    <header class="bg-white shadow-sm py-4 sticky top-0 z-50">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <img src="logo.png" alt="STEUNGLEAP Logo" class="h-10 md:h-12 w-auto object-contain">
                <span class="text-2xl md:text-3xl font-black text-red-600 tracking-wider">STEUNG<span class="text-gray-800">LEAP</span></span>
            </a>
            <div class="hidden md:flex items-center space-x-2">
                <input type="text" placeholder="ស្វែងរកព័ត៌មាន..." class="border rounded-l px-4 py-2 text-sm focus:outline-none focus:border-red-500">
                <button class="bg-red-600 text-white px-4 py-2 rounded-r text-sm hover:bg-red-700">ស្វែងរក</button>
            </div>
        </div>
    </header>

    <!-- Navigation Menu -->
    <nav class="bg-red-700 text-white shadow">
        <div class="container mx-auto px-4 flex space-x-6 overflow-x-auto py-3 text-sm font-medium">
            <a href="index.html" class="hover:text-yellow-300 whitespace-nowrap">ទំព័រដើម</a>
        </div>
    </nav>

    <!-- Scrolling Text (អក្សររត់) -->
    <div class="bg-yellow-400 text-gray-900 font-bold py-2 overflow-hidden shadow-inner">
        <div class="container mx-auto px-4">
            <marquee behavior="scroll" direction="left" scrollamount="5" class="text-sm md:text-base">
                សូមស្វាគមន៍មកកាន់ គេហទំព័រស្ទឹងលាភ (STEUNGLEAP) - ព័ត៌មានទាន់ហេតុការណ៍ និងត្រឹមត្រូវ!
            </marquee>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="container mx-auto px-4 py-6">
        <h2 class="text-xl font-bold mb-4 border-l-4 border-red-600 pl-3">ព័ត៌មានដែលបានចុះផ្សាយ</h2>
        
        <div id="visitor-news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 mt-12 py-8">
        <div class="container mx-auto px-4 text-center text-sm space-y-2">
            <p>លេខទូរសព្ទទំនាក់ទំនង: <a href="tel:0883473358" class="text-yellow-400 font-bold hover:underline">0883473358</a></p>
            <p>&copy; ២០២៦ STEUNGLEAP។ រក្សាសិទ្ធិគ្រប់យ៉ាង។</p>
        </div>
    </footer>

    <!-- Firebase SDK & Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCj8Fz-LyCydPLVz2F2z80NyyA-1JJnoIA",
            authDomain: "steungleap-123af.firebaseapp.com",
            projectId: "steungleap-123af",
            storageBucket: "steungleap-123af.firebasestorage.app",
            messagingSenderId: "97711978773",
            appId: "1:97711978773:web:577b7b53ff44836f8ed1ic"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadNews() {
            const container = document.getElementById('visitor-news-container');
            container.innerHTML = '<p class="text-gray-500 col-span-4 text-center py-8">កំពុងទាញយកព័ត៌មាន...</p>';

            try {
                const q = query(collection(db, "news"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    container.innerHTML = '<p class="text-gray-500 col-span-4 text-center py-8">មិនទាន់មានព័ត៌មានថ្មីៗនៅឡើយទេ...</p>';
                    return;
                }

                container.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    const item = doc.data();
                    const imagesArr = item.images || (item.image ? [item.image] : []);
                    const firstImage = imagesArr[0] || '';

                    container.innerHTML += `
                        <div class="bg-white rounded-lg shadow overflow-hidden flex flex-col border border-gray-200">
                            <img src="${firstImage}" alt="News" class="w-full h-40 object-cover">
                            <div class="p-4 flex flex-col flex-grow">
                                <h3 class="font-bold text-base mb-2 hover:text-red-600 cursor-pointer">${item.title}</h3>
                                <p class="text-gray-600 text-xs mb-4 flex-grow">${item.desc}</p>
                                <span class="text-xs text-gray-400">${item.date}</span>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                container.innerHTML = '<p class="text-red-500 col-span-4 text-center py-8">មានបញ្ហាក្នុងការភ្ជាប់ទិន្នន័យ។</p>';
            }
        }

        loadNews();
    </script>
</body>
</html>
